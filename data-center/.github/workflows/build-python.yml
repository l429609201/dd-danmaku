name: Build Python Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'python/**'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/package.json'
      - 'web/vite.config.js'
      - 'web/index.html'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - '.github/workflows/build-python.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'python/**'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/package.json'
      - 'docker/Dockerfile'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag (e.g., v1.0.0-python)'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: l429609201/dd-danmaku

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # 确定标签
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            # 手动触发且指定了标签
            TAGS="${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main 分支 -> latest-python
            TAGS="${{ env.IMAGE_NAME }}:latest-python"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            # develop 分支 -> test-python
            TAGS="${{ env.IMAGE_NAME }}:test-python"
          else
            # 其他分支 -> 分支名-python
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            TAGS="${{ env.IMAGE_NAME }}:${BRANCH_NAME}-python"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=DD-Danmaku Python Backend
            org.opencontainers.image.description=Python backend for DD-Danmaku data center
            org.opencontainers.image.vendor=l429609201
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ steps.meta.outputs.tags }} python --version
          echo "✅ Python backend image test passed"

      - name: Image digest
        run: echo "Image pushed successfully!"
