[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/api",
    "crates/worker-bridge",
    "crates/dandanplay",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["data-center team"]
license = "MIT"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.45", features = ["full"] }
async-trait = "0.1"

# Web 框架
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# ORM
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-query = "0.31"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 配置管理
config = "0.14"
dotenvy = "0.15"

# WebSocket
tokio-tungstenite = "0.24"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# GeoIP
maxminddb = "0.24"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# URL 解析（迁移身份校验）
url = "2.5"

# JWT 认证
jsonwebtoken = "9.3"
bcrypt = "0.16"

# HTTP 客户端（已有 hyper 从 axum 传递，但需要显式声明用于类型）
hyper = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
