[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# 内部依赖
db = { path = "../db" }

# ORM（需要直接引用类型）
sea-orm = { workspace = true }

# Web 框架
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
# 管理页面由同一端口提供静态文件，无需独立前端服务。
tower-http = { workspace = true, features = ["fs"] }

# HTTP 客户端（使用 axum 的 hyper 依赖，零新增）
hyper = "1.12"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1.12"

# 异步工具
tokio = { workspace = true }
futures-util = "0.3"
async-stream = "0.3"

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 实体标题规范化及季集号解析，与旧版检索语义保持一致。
unicode-normalization = "0.1"
regex = "1"

# 时间
chrono = { workspace = true }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# JWT 认证
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }

# 配置
dotenvy = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 错误处理
anyhow = { workspace = true }
md5 = "0.8.1"
sha2 = "0.10"
# 官方接口签名使用标准 Base64 编码。
base64 = "0.22"
# 复用已缓存的 ring，以 AES-256-GCM 加密数据库中的官方密钥。
ring = "0.17.14"

# Redis
redis = { workspace = true }

# GeoIP
maxminddb = { workspace = true }

# HTTP 客户端（AI API）
# 使用 rustls，避免 openssl-sys 需要系统 OpenSSL 开发包
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
db = { path = "../db", features = ["test-helpers"] }
tokio-tungstenite = "0.24"
