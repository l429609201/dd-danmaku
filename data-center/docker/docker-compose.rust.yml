# dd-danmaku 数据中心（Rust 版）部署示例
# 用法：docker compose -f docker-compose.rust.yml up -d
# 镜像由 .github/workflows/build-rust.yml 构建，main 分支标签为 latest-rust。

services:
  data-center-rust:
    image: l429609201/dd-danmaku:latest-rust
    # 如需本地构建，改用下面两行（构建上下文为 data-center 目录）
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile.rust
    container_name: danmu-data-center-rust
    restart: unless-stopped
    ports:
      - "7759:7759"
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=info
      # 监听地址：程序只读取 LISTEN_ADDR（默认 0.0.0.0:7759），须与镜像健康检查端口 7759 一致
      - LISTEN_ADDR=0.0.0.0:7759
      # 运行模式：worker（仅 CF 交互接口）或 api（独立弹幕服务 + 管理后台）
      - RUN_MODE=api
      # JWT 密钥：务必改成随机长字符串（openssl rand -hex 32）
      - JWT_SECRET=please_change_me_to_a_random_secret
      - JWT_EXPIRY_HOURS=24
      # 数据库：SQLite 需带 mode=rwc，否则文件不存在时无法创建
      - DATABASE_URL=sqlite:///app/config/database.db?mode=rwc
      # - DATABASE_URL=mysql://danmu_user:your_password@mysql:3306/danmu_data_center
      # - DATABASE_URL=postgres://postgres:your_password@postgres:5432/danmu_data_center
      - DANMAKU_STORE_DIR=/app/config/danmaku
      # Redis（可选）：REDIS_ENABLED=true 才会启用，否则缓存降级到数据库
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      # 挂载目录属主，按宿主机用户调整
      - PUID=1000
      - PGID=1000
      - UMASK=0022
    volumes:
      - ./data/config:/app/config
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: danmu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
