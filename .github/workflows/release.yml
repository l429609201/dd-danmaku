name: Build and Release

# test 分支更新固定预发行版（使用不同名的 test-release 标签）；正式版仅由版本标签触发。
on:
  push:
    branches: [test]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 拉取同一提交的后端、前端和 ede.js
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 核对发布目标
        id: target
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -eq 'refs/heads/test') {
            # Artifact 保持固定名称；发行版使用不同名的内部标签。
            'tag=test' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            # 在任何构建和发布动作之前确认标签提交属于 main 历史。
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw '获取 main 分支失败' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw '正式版标签提交不属于 main 分支' }
            "tag=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
          } else {
            throw '不支持的发布目标'
          }

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dll/ui/package-lock.json

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装管理前端依赖
        working-directory: dll/ui
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw '安装前端依赖失败' }

      - name: 构建 DLL 并嵌入管理前端与原始脚本
        env:
          DD_SIGN_SECRET: ${{ secrets.DD_SIGN_SECRET }}
          DD_BRAND_MARK: ${{ secrets.DD_BRAND_MARK }}
          DD_OBF_KEY: ${{ secrets.DD_OBF_KEY }}
          DD_RELAY_PREFIX: ${{ secrets.DD_RELAY_PREFIX }}
          DD_UPSTREAM_UA: ${{ secrets.DD_UPSTREAM_UA }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 密钥只写 CI 临时文件，不输出内容，不随 release 目录上传。
          $signingFile = Join-Path $env:RUNNER_TEMP 'dd-official-signing.json'
          @{ Secret = $env:DD_SIGN_SECRET; BrandMark = $env:DD_BRAND_MARK; ObfuscationKey = $env:DD_OBF_KEY; RelayPrefix = $env:DD_RELAY_PREFIX; UserAgent = $env:DD_UPSTREAM_UA } | ConvertTo-Json -Compress | Set-Content -LiteralPath $signingFile -Encoding UTF8
          # 正式版使用 vX.Y.Z 标签；测试版从 ede.js 的 @version 读取基础版本，再追加 Actions 运行号。
          $scriptText = Get-Content -LiteralPath 'ede.js' -Raw
          $versionMatch = [regex]::Match($scriptText, '(?m)^//[\t ]*@version[\t ]+(\d+\.\d+\.\d+)[\t ]*\r?$')
          if (-not $versionMatch.Success) { throw 'ede.js 缺少有效的 @version（必须为主.次.修订）' }
          $scriptVersion = $versionMatch.Groups[1].Value
          $assemblyVersion = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            "${scriptVersion}.$env:GITHUB_RUN_NUMBER"
          }
          if ($assemblyVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "无效的程序集版本：$assemblyVersion" }
          dotnet build dll/DD.Danmaku.csproj --configuration Release --nologo "-p:Version=$assemblyVersion" "-p:OfficialSigningFile=$signingFile"
          if ($LASTEXITCODE -ne 0) { throw 'DLL 构建失败' }

      - name: 压缩脚本并汇集全部产物
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global terser@5
          if ($LASTEXITCODE -ne 0) { throw '安装脚本压缩工具失败' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item ede.js release/ede.js
          Copy-Item dll/bin/Release/net8.0/DD.Danmaku.dll release/DD.Danmaku.dll
          terser ede.js --compress 'drop_console=true' --mangle --comments '/==UserScript==|@name|@description|@version|@author|@license|@namespace/' --output release/ede.min.js
          if ($LASTEXITCODE -ne 0) { throw '压缩 ede.js 失败' }

      - name: 保存统一构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ steps.target.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: 发布构建产物
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -eq 'refs/heads/test') {
            # Release 必须关联标签；只更新不同名的内部标签，避免与 test 分支冲突。
            git tag --force test-release $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw '更新测试版标签失败' }
            git push origin refs/tags/test-release --force
            if ($LASTEXITCODE -ne 0) { throw '推送测试版标签失败' }
            gh release view test-release
            if ($LASTEXITCODE -ne 0) {
              gh release create test-release --verify-tag --title 'test' --prerelease --latest=false --notes 'test 分支自动构建：ede.js、ede.min.js、DD.Danmaku.dll。'
              if ($LASTEXITCODE -ne 0) { throw '创建 test 预发行版失败' }
            } else {
              gh release edit test-release --title 'test' --prerelease --latest=false
              if ($LASTEXITCODE -ne 0) { throw '更新 test 预发行版失败' }
            }
            $env:RELEASE_TAG = 'test-release'
          } else {
            gh release view $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) {
              gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --generate-notes
              if ($LASTEXITCODE -ne 0) { throw '创建正式发行版失败' }
            }
          }
          gh release upload $env:RELEASE_TAG release/ede.js release/ede.min.js release/DD.Danmaku.dll --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传发行版附件失败' }
