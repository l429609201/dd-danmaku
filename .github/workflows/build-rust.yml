name: Build Rust Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'data-center/rust/**'
      - 'data-center/web/src/**'
      - 'data-center/web/public/**'
      - 'data-center/web/package.json'
      - 'data-center/web/vite.config.js'
      - 'data-center/web/index.html'
      - 'data-center/docker/Dockerfile.rust'
      - 'data-center/docker/rust-entrypoint.sh'
      - '.github/workflows/build-rust.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'data-center/rust/**'
      - 'data-center/web/src/**'
      - 'data-center/web/public/**'
      - 'data-center/web/package.json'
      - 'data-center/docker/Dockerfile.rust'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag (e.g., v2.0.0-rust)'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: l429609201/dd-danmaku

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # 确定标签
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            # 手动触发且指定了标签
            TAGS="${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main 分支 -> latest-rust
            TAGS="${{ env.IMAGE_NAME }}:latest-rust"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            # develop 分支 -> test-rust
            TAGS="${{ env.IMAGE_NAME }}:test-rust"
          else
            # 其他分支 -> 分支名-rust
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            TAGS="${{ env.IMAGE_NAME }}:${BRANCH_NAME}-rust"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./data-center
          file: ./data-center/docker/Dockerfile.rust
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=DD-Danmaku Rust Backend
            org.opencontainers.image.description=Rust backend for DD-Danmaku data center
            org.opencontainers.image.vendor=l429609201
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ steps.meta.outputs.tags }} /app/data-center --version || echo "Version command not available"
          echo "✅ Rust backend image test passed"

      - name: Image digest
        run: echo "Image pushed successfully!"
